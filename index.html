<script>
/* Сховище на сервері сайту (Cloudflare KV через /team/api/storage).
   Сторінка бачить його як window.storage і працює в режимі 'ws'. */
(function () {
  if (window.claude) return; // у артефакті Claude лишаємо рідне сховище
  var API = '/team/api/storage';
  function q(p) { return API + '?' + new URLSearchParams(p).toString(); }
  async function call(url, opt) {
    var r = await fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opt || {}));
    if (r.status === 401 || r.status === 403) { location.href = '/team/login'; throw new Error('потрібен вхід'); }
    if (!r.ok && r.status !== 404) throw new Error('сервер відповів ' + r.status);
    return r;
  }
  window.storage = {
    async get(key) { var r = await call(q({ key: key })); if (r.status === 404) return null; return { key: key, value: await r.text() }; },
    async set(key, value) { await call(q({ key: key }), { method: 'PUT', body: String(value), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }); return { key: key, value: value }; },
    async delete(key) { await call(q({ key: key }), { method: 'DELETE' }); return { key: key, deleted: true }; },
    async list(prefix) { var r = await call(q({ prefix: prefix || '' })); return await r.json(); }
  };
  document.addEventListener('DOMContentLoaded', function () {
    var s = document.getElementById('store'); if (!s) return;
    var a = document.createElement('a'); a.href = '/team/logout'; a.textContent = 'Вийти';
    a.style.cssText = 'margin-left:14px;font-size:11px;letter-spacing:.08em;color:inherit;opacity:.6;text-decoration:underline';
    s.insertAdjacentElement('afterend', a);
  });
})();
</script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  --bg:#ffffff;--fg:#000000;--mute:#767676;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.28);--soft:rgba(0,0,0,.035);--soft2:rgba(0,0,0,.07);

:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#8f8f8f;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.3);--soft:rgba(255,255,255,.04);--soft2:rgba(255,255,255,.08);--warn:#e8a33d;--bad:#ff6b6b;--ok:#5fd08a;color-scheme:dark}

button,input,select,textarea{font:inherit;color:inherit}

.wrap{max-width:1320px;margin:0 auto;padding:0 48px}
/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.navl a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--fg);transition:width .3s}
.navl a:hover::after,.navl a[aria-current="page"]::after{width:100%}

.store.db i{background:var(--ok)}
/* type */

.btn::before{content:"";position:absolute;inset:0;left:-101%;width:100%;background:var(--fg);transition:left .3s;z-index:0}

<script>/* ===== Медіа Дотичне · Співпрацівники — document engine ===== */

/* ---------- Ukrainian name declension (heuristic; every result can be overridden in the UI) ---------- */
const VOW = 'аеєиіїоуюяь\'ʼ’';
const HUSH = 'жчшщ';
const ALT = { 'г': 'з', 'к': 'ц', 'х': 'с' };
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function caseLike(src, out) { return src && src === src.toUpperCase() && src.length > 1 ? out.toUpperCase() : out; }
function nounA(w, c) { // feminine/masculine noun in -а
  const st = w.slice(0, -1), last = st.slice(-1).toLowerCase();
  if (c === 'acc') return st + 'у';
  if (c === 'gen') return st + (HUSH.includes(last) ? 'і' : 'и');
  return (ALT[last] ? st.slice(0, -1) + ALT[last] : st) + 'і';

  const l = w.toLowerCase();
  const end = n => l.slice(-n);

/* ===== Додаток 1 — Заява ===== */

function shortN(v) { return [v.last || 'Без_імені', (v.first || '').charAt(0) + (v.middle || '').charAt(0)].filter(Boolean).join('_'); }

function docModelRaw(kind, idx, v) {

  switch (kind) {
    case 'app': return DE.docApplication(CFG, v);

function docModel(kind, idx, v) { v = v || D; return DE.applyEdits(docModelRaw(kind, idx, v), (v.docEdits || {})[docKey(kind, idx)]); }
function docFile(kind, idx, v, ext) {

function applyRole(card, role) {

  card.roles.push({ name: role.name });
  const tasks = (card.tasks || []).filter(t => t && t.trim());
  (role.tasks || []).forEach(t => { if (t && !tasks.includes(t)) tasks.push(t); });
  card.tasks = tasks;
  if (role.access && !(card.access || '').includes(role.access)) card.access = (card.access ? card.access.trim().replace(/[;.]$/, '') + '; ' : '') + role.access;
  card.conditions = card.conditions || {};

  if (role.otherText && !(card.conditions.otherText || '').includes(role.otherText)) card.conditions.otherText = (card.conditions.otherText ? card.conditions.otherText + '; ' : '') + role.otherText;
}

/* pure: apply order to a volunteer copy */
function applyOrder(kind, vol, p, no) {
  const v = normVol(clone(vol));
  if (kind === 'enroll') {
    Object.assign(v.docs, clone(p.docs || {}), { orderNo: no, orderDate: p.date });
    v.status = 'active';

  }
  if (kind === 'end') {

    v.status = 'ended';
    return { v, idx: null };
  }
  const prev = DE.snapOf(v.card);
  if (kind === 'extend') v.card.end = p.newEnd;
  else ['roles', 'unit', 'curatorId', 'start', 'end', 'tasks', 'results', 'access', 'conditions'].forEach(k => v.card[k] = clone(p.card[k]));
  v.changes.push({ prev, date: p.date, orderNo: no, orderDate: p.date, basis: p.basis || '', note: p.note || '' });
  return { v, idx: v.changes.length - 1 };
}
function orderErrors() {

    const r = applyOrder('enroll', M.vol, M, nextOrderNo());

    if (M.vol.status === 'active') e.push('співпрацівника вже зараховано');

    if (!M.vol.card.end) e.push('чинний строк у картці');

    else if (M.vol.card.end && M.newEnd <= M.vol.card.end) e.push('нова дата має бути пізніша за чинну');
  } else if (M.kind === 'change') {
    const raw = DE.describeChanges(CFG, DE.snapOf(M.vol.card), M.card);
    if (!raw.length && !(M.note || '').trim()) e.push('жодної зміни умов');
    const r = applyOrder('change', M.vol, M, nextOrderNo());

    if (!M.endDate) e.push('дата припинення');

/* ===================== ПІДПИСАНІ ФАЙЛИ ТА ПЕРЕВІРКА ЕП ===================== */
const SIG_ACCEPT = '.pdf,.p7s,.p7m,.sig,.asice,.asics,.sce,.zip,.jpg,.jpeg,.png';
const RAW_MIMES = ['application/pdf', 'image/png', 'image/jpeg']; // типи, які приймає сховище артефакту без кодування
const SG = { orderId: null, pending: null, checkOnly: null };
const isSigName = n => /\.(p7s|p7m|sig|asice|asics|sce)$/i.test(n);
const stemOf = n => n.replace(/\.(p7s|p7m|sig)$/i, '');
function mimeOf(name) {
  const e = (name.split('.').pop() || '').toLowerCase();
  return { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg' }[e] || 'application/octet-stream';
}
function b64encodeBytes(u8) { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
function b64decodeBytes(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

/* ---- file storage: артефакт (db) → assets; інші режими → base64 у сховищі браузера ---- */
const Files = {
  async put(bytes, name, mime) {
    if (Store.mode === 'db') {
      const assets = await window.claude.use('assets');
      if (!assets) throw new Error('немає права завантажувати файли в цей артефакт');
      if (RAW_MIMES.includes(mime)) {
        const r = await assets.upload(new Blob([bytes], { type: mime }), { type: mime });
        return { ref: r.id, enc: 'raw' };
      }
      const r = await assets.upload(new Blob([b64encodeBytes(bytes)], { type: 'text/plain' }), { type: 'text/plain' });
      return { ref: r.id, enc: 'b64' };
    }
    const ref = 'loc:' + uid();
    await Store.blobPut(ref, b64encodeBytes(bytes));
    return { ref, enc: 'local' };
  },
  async get(f) {
    if (Store.mode === 'db') {
      const res = await fetch('/_blob/' + f.ref);
      if (!res.ok) throw new Error('файл недоступний (' + res.status + ')');
      if (f.enc === 'raw') return new Uint8Array(await res.arrayBuffer());
      return b64decodeBytes((await res.text()).trim());
    }
    const b = await Store.blobGet(f.ref);
    if (!b) throw new Error('файл не знайдено у сховищі браузера');
    return b64decodeBytes(b);
  },
  async del(f) {
    if (!f || !f.ref) return;
    if (Store.mode === 'db') { try { const assets = await window.claude.use('assets'); if (assets) await assets.delete(f.ref); } catch (e) { } return; }
    await Store.blobDel(f.ref);
  },
};

/* ---- storage hooks (додаються до Store) ---- */
Store.blobPut = async function (ref, b64) {
  if (this.mode === 'ws') { const r = await window.storage.set('blob:' + ref, b64, false); if (!r) throw new Error('сховище не відповіло'); return; }
  const o = this._o(); o.blobs = o.blobs || {}; o.blobs[ref] = b64;
  if (this.mode === 'local') { try { this._put(o); } catch (e) { throw new Error('сховище браузера переповнене, видаліть старі файли'); } }
};
Store.blobGet = async function (ref) {
  if (this.mode === 'ws') { try { const r = await window.storage.get('blob:' + ref, false); return r && r.value ? r.value : null; } catch (e) { return null; } }
  return (this._o().blobs || {})[ref] || null;
};
Store.blobDel = async function (ref) {
  if (this.mode === 'ws') { try { await window.storage.delete('blob:' + ref, false); } catch (e) { } return; }
  const o = this._o(); if (o.blobs) delete o.blobs[ref]; if (this.mode === 'local') this._put(o);
};
Store.delOrder = async function (id) {
  if (this.mode === 'db') return this.db.collection('orders').doc(id).delete();
  if (this.mode === 'ws') { await window.storage.delete('ord:' + id, false); return; }
  const o = this._o(); delete o.orders[id]; if (this.mode === 'local') this._put(o);
};
Store.clearAll = async function () {
  if (this.mode === 'db') {
    for (const d of (await this.db.collection('orders').get()).docs) await this.db.collection('orders').doc(d.data().id).delete();
    for (const d of (await this.db.collection('volunteers').get()).docs) await this.db.collection('volunteers').doc(d.data().id).delete();
    return;
  }
  if (this.mode === 'ws') {
    for (const pre of ['vol:', 'ord:', 'blob:']) for (const k of await this._listws(pre)) { try { await window.storage.delete(k, false); } catch (e) { } }
    return;
  }
  const o = this._o(); o.vols = {}; o.orders = {}; o.blobs = {}; if (this.mode === 'local') this._put(o);
};

/* ---- перевірка набору файлів (без збереження) ---- */
async function inspectFiles(fileList) {
  const files = Array.from(fileList);
  const docs = files.filter(f => !isSigName(f.name));
  const items = [];
  for (const f of files) {
    if (f.size > 20 * 1024 * 1024) { toast('Файл завеликий (понад 20 МБ): ' + f.name, true); continue; }
    const bytes = new Uint8Array(await f.arrayBuffer());
    let contentBytes = null;
    if (/\.(p7s|p7m|sig)$/i.test(f.name)) {
      const doc = docs.find(d => d.name === stemOf(f.name)) || (docs.length === 1 ? docs[0] : null);
      if (doc) contentBytes = new Uint8Array(await doc.arrayBuffer());
    }
    const rep = await SIGN.inspect(bytes, f.name, { contentBytes });
    items.push({ name: f.name, size: f.size, mime: mimeOf(f.name), bytes, rep });
  }
  return items;
}
const VERDICT_SHORT = v => /коректний/.test(v) ? 'підпис коректний' : /не пройдено/.test(v) ? 'НЕ ПРОЙДЕНО' : /частково/.test(v) ? 'перевірено частково' : 'не виявлено підпис';

/* ---- модальне вікно ---- */
function openSigns(orderId) {
  SG.orderId = orderId; SG.pending = null; SG.checkOnly = null;
  MK = 'sign'; renderModal();
}
function signOrder() { return ORDERS.find(o => o.id === SG.orderId) || null; }
function signRowHtml(f, scope) {
  const r = f.rep || {};
  const v = VERDICT_SHORT(r.verdict || '');
  const key = scope + ':' + (f.ref || f.idx);
  return '<div class="doc"><div class="dt"><b>' + esc(f.name) + '</b><small>' + esc(Math.round((f.size || 0) / 1024) + ' КБ') + '</small></div>' +
    '<div class="miss okk">' + esc((r.format || '—') + ' · ' + v) + '</div>' +
    '<div class="dacts">' +
    (scope === 'saved' ? '<button class="lnk" data-act="sigGet" data-arg="' + esc(f.ref) + '">Завантажити</button><button class="lnk" data-act="sigRecheck" data-arg="' + esc(f.ref) + '">Перевірити ще раз</button>' : '') +
    ((r.signers && r.signers.length) ? '<button class="lnk" data-act="sigProto" data-arg="' + esc(key) + ':docx">Протокол Word</button><button class="lnk" data-act="sigProto" data-arg="' + esc(key) + ':pdf">Протокол PDF</button>' : '') +
    (scope === 'saved' ? '<button class="lnk bad" data-act="sigDel" data-arg="' + esc(f.ref) + '">Видалити</button>' : '') +
    '</div></div>';
}
function signHtml() {
  const o = signOrder();
  if (!o) return '<div class="ov"><div class="mod"><p>Наказ не знайдено.</p><button class="btn ghost" data-act="closeM">Закрити</button></div></div>';
  const saved = o.files || [];
  let h = '<div class="ov"><div class="mod wide" role="dialog" aria-modal="true" aria-label="Підписані файли">' +
    '<div class="mod-h"><div><h2>Підписані файли · ' + esc(o.no) + '</h2><p>' + esc(KIND_LONG[o.kind]) + ' · ' + esc(o.name) + '. Файли зберігаються разом з наказом.</p></div><button class="x" data-act="closeM" aria-label="Закрити">×</button></div>';
  h += '<h2 class="sec">Додати файли</h2>';
  h += '<p class="hint" style="margin-bottom:12px">Підтримуються: .pdf з підписом (PAdES), .p7s / .p7m (CMS), .asice / .asics / .sce (контейнер), .zip, .sig, а також скани .jpg / .png. Перевірка виконується в браузері. Відокремлений .p7s перевіряє цілісність, якщо в тому ж виборі є підписаний файл з такою самою назвою.</p>';
  h += '<label class="btn ghost sm" style="cursor:pointer;display:inline-flex"><span>Обрати файли</span><input type="file" multiple accept="' + SIG_ACCEPT + '" data-act-change="sigPick" class="sr"></label>';
  if (SG.pending) {
    h += '<h2 class="sec">Нові файли (ще не збережено)</h2>' + SG.pending.map((f, i) => signRowHtml(Object.assign({ idx: i }, f), 'pending')).join('') +
      '<div class="mod-f" style="justify-content:flex-start;margin-top:14px"><button class="btn fill" data-act="sigSave"><span>Зберегти до наказу</span></button><button class="btn ghost" data-act="sigCheckOnly"><span>Лише перевірити, не зберігати</span></button><button class="btn ghost" data-act="sigCancelPending"><span>Скасувати</span></button></div>';
  }
  h += '<h2 class="sec">Збережені файли (' + saved.length + ')</h2>';
  h += saved.length ? saved.map(f => signRowHtml(f, 'saved')).join('') : '<div class="hint">Файлів ще немає.</div>';
  if (SG.checkOnly && SG.checkOnly.length) h += '<h2 class="sec">Результат перевірки без збереження</h2>' + SG.checkOnly.map((f, i) => signRowHtml(Object.assign({ idx: i }, f), 'check')).join('');
  h += '<div class="hint" style="margin-top:18px">Протокол містить дані про документ (назва, хеш SHA-256, розмір), дані підписанта, строк дії сертифіката, час підпису й результати перевірки. Ланцюг довіри до ЦСК і статус відкликання в браузері не перевіряються — це зазначено в протоколі.</div>';
  h += '</div></div>';
  return h;
}
function protoFor(f, key) {
  return f;
}
async function buildProtocolModel(o, f) {
  const r = f.rep || {};
  return DE.docVerifyProtocol(CFG, {
    orderNo: o.no, orderDate: o.date, kindLong: KIND_LONG[o.kind], personName: o.name,
    fileName: f.name, size: f.size, sha256hex: r.sha256hex, checkedAt: r.checkedAt, checkedBy: '',
  }, [{ name: f.name, report: r }]);
}
async function downloadProtocol(f, fmt, o) {
  const m = await buildProtocolModel(o, f);
  const blob = fmt === 'pdf' ? await pdfBlob(m) : await docxBlob(m);
  await saveFile('Протокол_ЕП_' + o.no + '_' + stemOf(f.name).replace(/[\\/:*?"<>|\s]+/g, '_') + '.' + fmt, blob);
}

/* ---- події підписів ---- */
async function sigPick(fileList) {
  toast('Перевіряю файли…');
  try { SG.pending = await inspectFiles(fileList); SG.checkOnly = null; toast('Перевірку завершено'); }
  catch (e) { toast('Не вдалося перевірити: ' + (e.message || e), true); }
  renderModal();
}
async function sigSave() {
  const o = signOrder(); if (!o || !SG.pending) return;
  const items = SG.pending.slice();
  let saved = 0;
  for (const it of items) {
    try {
      const put = await Files.put(it.bytes, it.name, it.mime);
      o.files = (o.files || []).concat([{ ref: put.ref, enc: put.enc, name: it.name, size: it.size, mime: it.mime, rep: it.rep }]);
      saved++;
    } catch (e) { toast('Не вдалося зберегти ' + it.name + ': ' + (e.message || e), true); }
  }
  if (saved) {
    try { await Store.saveOrder(o); SG.pending = null; toast('Збережено файлів: ' + saved); }
    catch (e) { toast('Не вдалося зберегти наказ: ' + (e.message || e), true); }
  }
  renderAny(); renderModal();
}
function sigCheckOnly() {
  SG.checkOnly = SG.pending; SG.pending = null; renderModal();
}
async function sigDel(ref) {
  const o = signOrder(); if (!o) return;
  const f = (o.files || []).find(x => x.ref === ref); if (!f) return;
  const ok = await askChoice('Видалити файл?', '«' + f.name + '» буде видалено з наказу. Відновити його буде неможливо.', ['Видалити', 'Скасувати']);
  if (ok !== 'Видалити') return;
  await Files.del(f);
  o.files = o.files.filter(x => x.ref !== ref);
  try { await Store.saveOrder(o); toast('Файл видалено'); } catch (e) { toast('Помилка: ' + (e.message || e), true); }
  renderModal(); renderAny();
}
async function sigGet(ref) {
  const o = signOrder(); const f = o && (o.files || []).find(x => x.ref === ref); if (!f) return;
  try { const bytes = await Files.get(f); await saveFile(f.name, new Blob([bytes], { type: f.mime || 'application/octet-stream' })); }
  catch (e) { toast('Не вдалося завантажити файл: ' + (e.message || e), true); }
}
async function sigRecheck(ref) {
  const o = signOrder(); const f = o && (o.files || []).find(x => x.ref === ref); if (!f) return;
  try {
    const bytes = await Files.get(f);
    const docs = (o.files || []).filter(x => !isSigName(x.name));
    let contentBytes = null;
    if (/\.(p7s|p7m|sig)$/i.test(f.name)) { const d = docs.find(x => x.name === stemOf(f.name)); if (d) contentBytes = await Files.get(d); }
    f.rep = await SIGN.inspect(bytes, f.name, { contentBytes });
    await Store.saveOrder(o); toast('Перевірку оновлено'); renderModal(); renderAny();
  } catch (e) { toast('Не вдалося перевірити: ' + (e.message || e), true); }
}
async function sigProto(arg) {
  const parts = arg.split(':'); const fmt = parts.pop(); const scope = parts.shift(); const id = parts.join(':');
  const o = signOrder(); if (!o) return;
  let f = null;
  if (scope === 'saved') f = (o.files || []).find(x => x.ref === id);
  else if (scope === 'pending') f = SG.pending && SG.pending[+id];
  else if (scope === 'check') f = SG.checkOnly && SG.checkOnly[+id];
  if (!f) return toast('Файл не знайдено', true);
  try { await downloadProtocol(f, fmt, o); } catch (e) { toast('Не вдалося сформувати протокол: ' + (e.message || e), true); }
}

/* ---- видалення наказів і картки з каскадом ---- */
const ordersOfVol = vid => ORDERS.filter(o => o.volId === vid);
function isLatestOrder(o) {
  const mine = ordersOfVol(o.volId);
  return mine.every(x => parseSp(x.no) <= parseSp(o.no));
}
async function deleteOrderCascade(id) {
  const o = ORDERS.find(x => x.id === id); if (!o) return;
  if (!isLatestOrder(o)) return toast('Спочатку видаліть пізніші накази цього співпрацівника', true);
  const hasBefore = !!o.before;
  const ok = await askChoice('Видалити наказ ' + o.no + '?',
    hasBefore ? 'Картку співпрацівника буде повернено до стану до цього наказу. Підписані файли наказу буде видалено. Це не можна скасувати.'
      : 'Наказ створено до оновлення системи, тому картку не вдасться повернути автоматично: буде видалено лише запис наказу та його файли. Це не можна скасувати.',
    ['Видалити', 'Скасувати']);
  if (ok !== 'Видалити') return;
  try {
    for (const f of (o.files || [])) await Files.del(f);
    if (hasBefore) {
      const back = normVol(clone(o.before));
      await Store.saveVol(back);
      const i = VOLS.findIndex(v => v.id === back.id); if (i >= 0) VOLS[i] = back;
      if (D && D.id === back.id) { D = normVol(clone(back)); DIRTY = false; }
    }
    await Store.delOrder(o.id);
    ORDERS = ORDERS.filter(x => x.id !== o.id);
    toast('Наказ видалено' + (hasBefore ? ', картку повернено' : ''));
  } catch (e) { toast('Не вдалося видалити: ' + (e.message || e), true); }
  if (MK === 'sign') closeModal();
  renderAny();
}
async function deleteVolCascade(vid) {
  const v = findVol(vid); if (!v) return;
  const mine = ordersOfVol(vid);
  const ok = await askChoice('Видалити картку?', '«' + (DE.fullName(v) || 'без імені') + '» буде видалено з реєстру' + (mine.length ? ', разом з ' + mine.length + ' наказ(ами) і їхніми підписаними файлами' : '') + '. Відновити буде неможливо.', ['Видалити', 'Скасувати']);
  if (ok !== 'Видалити') return false;
  for (const o of mine) { for (const f of (o.files || [])) await Files.del(f); await Store.delOrder(o.id); }
  ORDERS = ORDERS.filter(o => o.volId !== vid);
  await Store.delVol(vid);
  VOLS = VOLS.filter(x => x.id !== vid);
  DIRTY = false; D = null;
  return true;
}
async function clearAllData() {
  const ok = await askChoice('Очистити всі картки й накази?', 'Буде видалено всі картки співпрацівників, усі накази, їхні підписані файли. Довідники (організація, куратори, ролі) залишаться. Це не можна скасувати. Рекомендуємо спершу зробити резервну копію.', ['Очистити', 'Скасувати']);
  if (ok !== 'Очистити') return;
  try {
    for (const o of ORDERS) for (const f of (o.files || [])) await Files.del(f);
    await Store.clearAll();
    VOLS = []; ORDERS = []; D = null; DIRTY = false;
    toast('Усі картки й накази очищено');
    renderSettings();
  } catch (e) { toast('Не вдалося очистити: ' + (e.message || e), true); }
}

/* ---- підключення до існуючих обробників ---- */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.actChange === 'sigPick' && el.files && el.files.length) { sigPick(el.files); el.value = ''; }
});
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, arg = b.dataset.arg;
  if (a === 'sigOpen') return openSigns(arg);
  if (a === 'sigSave') return sigSave();
  if (a === 'sigCheckOnly') return sigCheckOnly();
  if (a === 'sigCancelPending') { SG.pending = null; return renderModal(); }
  if (a === 'sigDel') return sigDel(arg);
  if (a === 'sigGet') return sigGet(arg);
  if (a === 'sigRecheck') return sigRecheck(arg);
  if (a === 'sigProto') return sigProto(arg);
  if (a === 'ordDel') return deleteOrderCascade(arg);
  if (a === 'clearAll') return clearAllData();
});

/* ---------- boot ---------- */
(async function boot() {
  if (window.DOC_LOGO) DE.setLogo(window.DOC_LOGO);
  await Store.init();
  try { const r = await Store.load(); CFG = normCfg(r.cfg ? clone(r.cfg) : null); VOLS = (r.vols || []).map(x => normVol(clone(x))); ORDERS = (r.orders || []).map(o => Object.assign(clone(o), { vol: normVol(clone(o.vol)) })); }
  catch (e) { toast('Не вдалося завантажити дані (' + ((e && e.code) || 'помилка') + '). Спробуйте оновити сторінку.', true); }
  const s = $('#store'); s.className = 'store' + (Store.mode === 'db' || Store.mode === 'ws' ? ' db' : ''); s.innerHTML = '<i></i>' + esc(storeText(false));
  $('#foot').textContent = storeText(false);
  route();
})();
})();
</script>
